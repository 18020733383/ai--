<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 领主：卡拉迪亚编年史</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Noto Serif SC"', 'Cinzel', 'serif'],
              sans: ['"Noto Sans SC"', 'Lato', 'sans-serif'],
            },
            colors: {
              parchment: '#f3e5ab',
              'parchment-dark': '#d4c58c',
              iron: '#434b4d',
              blood: '#8a1c1c',
              gold: '#ffd700',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #1a1a1a;
        color: #e5e5e5;
      }
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      @keyframes logSlideIn {
        0% {
          opacity: 0;
          transform: translateY(6px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .log-slide-in {
        animation: logSlideIn 0.25s ease-out;
      }
      @keyframes thinkingDot {
        0%, 80%, 100% { opacity: 0.3; }
        40% { opacity: 1; }
      }
      .thinking-dot { animation: thinkingDot 1.2s ease-in-out infinite; }
      .thinking-dot-2 { animation: thinkingDot 1.2s ease-in-out 0.15s infinite; }
      .thinking-dot-3 { animation: thinkingDot 1.2s ease-in-out 0.3s infinite; }
      @keyframes navPress {
        0% { transform: scale(1); }
        50% { transform: scale(0.94); }
        100% { transform: scale(1); }
      }
      @keyframes mainViewFadeIn {
        from { opacity: 0.88; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .nav-interactive {
        transition: transform 0.2s ease-out, color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
      }
      .nav-interactive:hover {
        transform: translateY(-1px);
      }
      .nav-interactive:active {
        transform: scale(0.96) translateY(0);
      }
      .app-main-view-enter {
        animation: mainViewFadeIn 0.32s ease-out;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
